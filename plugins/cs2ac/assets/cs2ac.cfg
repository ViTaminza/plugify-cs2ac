// CS2AC loads this file automatically.
// Use 1 to enable a setting and 0 to disable it.

// Master switch. Turning this off stops every detector.
cs2ac_enabled 1

// Automatic updates are off by default in this fork so a local build can never
// silently replace itself with the upstream author's release. To opt in, set
// cs2ac_update_repository to THIS fork's "owner/repo" and set cs2ac_auto_update 1.
// An update that was already prepared before this was disabled may still install
// on the next restart.
cs2ac_auto_update 0
cs2ac_update_repository ""

// Whitelisted SteamID64s are still detected and announced, but they are never punished.
// Separate multiple IDs with commas.
// Example: cs2ac_whitelist "76561198000000001,76561198000000002"
cs2ac_whitelist ""

// Detection modules. They are all enabled by default.
cs2ac_aimbot_enabled 1
cs2ac_aimlock_enabled 1
cs2ac_antiaim_enabled 1
cs2ac_autostrafe_enabled 1
cs2ac_bhop_enabled 1
cs2ac_dll_injection_enabled 1
cs2ac_desubticking_enabled 1
cs2ac_doubletap_enabled 1
cs2ac_hyperscroll_enabled 1
cs2ac_inhuman_accuracy_enabled 1
cs2ac_invalid_cvar_enabled 1
cs2ac_invalid_input_enabled 1
cs2ac_irregular_behavior_enabled 1
cs2ac_namechanger_enabled 1
cs2ac_nulls_enabled 1
cs2ac_silentaim_enabled 1
cs2ac_subtick_spam_enabled 1
cs2ac_triggerbot_enabled 1

// Detection announcements.
cs2ac_chat_announcements 1
cs2ac_center_announcements 1
// Show each player the "protected by CS2AC" notice 10 seconds after joining (chat line and center message).
cs2ac_join_watermark 0

// Language used for chat, center-screen announcements, and Discord reports.
// Bundled language codes are listed in addons/cs2ac/translations.
cs2ac_language "en"

// Commands run after a detection. Permanent bans are reserved for multi-episode
// AIMBOT, AIMLOCK, and SILENTAIM evidence. Movement, client-setting, integrity,
// behavioural, and subtick findings are report-only by default so they cannot
// falsely punish an idle or high-sensitivity player; set cs2ac_weak_signal_policy
// to "kick" to run cs2ac_kick_command for them instead. Leave a value empty to
// disable that punishment.
// Available placeholders: {steamid64}, {userid}, and {detection}.
cs2ac_punishment_command "css_addban {steamid64} 0 CS2AC: {detection}"
cs2ac_kick_command "css_kick #{userid} CS2AC: {detection}"
// Kick a player who trips a listed detection cs2ac_stream_kick_reports times within
// cs2ac_stream_kick_seconds, even under the report policy. Empty list turns it off.
cs2ac_stream_kick_detections "INVALID INPUT,NAMECHANGER"
cs2ac_stream_kick_reports 20
cs2ac_stream_kick_seconds 180
// Detections that kick (never ban) even under the report policy.
cs2ac_kick_detections "TRIGGER PATTERN,MOUSE MISMATCH,ANTIAIM"
// Listed findings still kick (never ban) when the network check vetoes punishment.
cs2ac_unstable_kick_detections "ANTIAIM"
// Kick once this many different report-only detections fired in one connection (0 = off).
// Detections in the ignore list do not count.
cs2ac_combo_kick_types 3
cs2ac_combo_ignore_detections "BHOP,NULLS"
// Kick a player who trips a listed detection cs2ac_burst_kick_reports times within
// cs2ac_burst_kick_seconds. Empty list turns it off.
cs2ac_burst_kick_detections "DESUBTICKING"
cs2ac_burst_kick_reports 3
cs2ac_burst_kick_seconds 60
// The second kick for a listed detection within cs2ac_repeat_ban_hours becomes a ban of
// cs2ac_repeat_ban_minutes (through admin_system only). Detections in needs_other also need
// another finding (not BHOP, NULLS or RCS) in that window. Empty list turns it off.
// A listed ban detection falls back to reports once cs2ac_mass_guard_players different players
// trip it within cs2ac_mass_guard_minutes on this server (a game update, not cheaters).
cs2ac_mass_guard_detections "DLL INJECTION"
cs2ac_mass_guard_players 5
cs2ac_mass_guard_minutes 60
cs2ac_repeat_ban_detections "TRIGGER PATTERN,INVALID INPUT"
cs2ac_repeat_ban_needs_other "INVALID INPUT"
cs2ac_repeat_ban_hours 24
cs2ac_repeat_ban_minutes 1440
// MOUSE MISMATCH: judged after this many view turns with horizontal mouse movement,
// reported when fewer than this share of them went the way the mouse moved.
cs2ac_mouse_mismatch_samples 100
cs2ac_mouse_mismatch_agreement 0.9
// Weak findings are reported but never punished by default. Use "kick" only after
// you accept that these signals can still be wrong on unusual but legit clients.
cs2ac_weak_signal_policy "report"

// Optional Discord detection reports. The webhook URL is kept out of console output.
cs2ac_webhook_url ""
// Enter a Discord role ID to mention it on every report, or leave this empty.
cs2ac_webhook_role_id ""
// Leave empty to use Steam's public server IP and hostport automatically.
cs2ac_webhook_server_address ""
// Optional public HTTPS logo used for Discord branding and as the avatar fallback.
cs2ac_webhook_logo_url ""

// Diagnostic messages are quiet by default.
cs2ac_aimbot_debug 0
cs2ac_aimlock_debug 0
cs2ac_antiaim_debug 0
cs2ac_autostrafe_debug 0
cs2ac_bhop_debug 0
cs2ac_dll_injection_debug 0
cs2ac_doubletap_debug 0
cs2ac_hyperscroll_debug 0
cs2ac_inhuman_accuracy_debug 0
cs2ac_invalid_cvar_debug 0
cs2ac_irregular_debug 0
cs2ac_namechanger_debug 0
cs2ac_nulls_debug 0
cs2ac_silentaim_debug 0
cs2ac_subtick_debug 0
cs2ac_triggerbot_debug 0

// Keep this off on public servers. It only exists for local testing with sv_cheats 1.
cs2ac_allow_sv_cheats_testing 0

// Keep this last so CS2AC can confirm that the whole file was applied.
cs2ac_config_loaded
